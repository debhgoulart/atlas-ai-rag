openapi: 3.1.0
info:
  title: Atlas AI - User Authentication and Gemini Key Management API
  version: 1.0.0
  description: API contracts for user authentication, encrypted credential storage, and Gemini API Key status management.

paths:
  /api/v1/auth/register:
    post:
      summary: Register a new user
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegisterRequest'
      responses:
        '201':
          description: User successfully registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Email already registered or invalid input

  /api/v1/auth/login:
    post:
      summary: Authenticate user and issue JWT token
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
      responses:
        '200':
          description: Successfully authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Incorrect email or password

  /api/v1/auth/me:
    get:
      summary: Get currently authenticated user
      tags: [Authentication]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Missing or invalid token

  /api/v1/settings/gemini-key/status:
    get:
      summary: Get Gemini API Key status for authenticated user
      tags: [Gemini Credentials]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current status of the user's Gemini API Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeminiKeyStatusResponse'
        '401':
          description: Unauthorized

  /api/v1/settings/gemini-key:
    post:
      summary: Register or replace Gemini API Key
      tags: [Gemini Credentials]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeminiKeyCreateRequest'
      responses:
        '200':
          description: Key validated, encrypted, and saved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeminiKeyStatusResponse'
        '400':
          description: Key failed validation with Google Gemini
        '401':
          description: Unauthorized

    delete:
      summary: Remove stored Gemini API Key
      tags: [Gemini Credentials]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Key removed successfully, status reset to NOT_CONFIGURED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeminiKeyStatusResponse'
        '401':
          description: Unauthorized

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    UserRegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    UserLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    TokenResponse:
      type: object
      required: [access_token, token_type]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: bearer

    UserResponse:
      type: object
      required: [id, email, is_active, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time

    GeminiKeyCreateRequest:
      type: object
      required: [api_key]
      properties:
        api_key:
          type: string
          description: Raw Google Gemini API Key starting with AIzaSy...
          example: AIzaSyD3x94KExampleKeyHere

    GeminiKeyStatusResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [NOT_CONFIGURED, VALID, INVALID]
          example: VALID
        key_hint:
          type: string
          nullable: true
          example: "...3aF1"
        last_validated_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
